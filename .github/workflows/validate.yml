name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Schema and Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install validator dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Validate examples and fixtures
        run: python scripts/validate.py --all
      - name: Run regression tests
        run: python -m unittest discover -s test -p 'test_*.py'

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Type-check and lint
        run: npm run check
      - name: Build registry and search index
        run: npm run build
      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: schema-registry-dist
          path: dist
          if-no-files-found: error
