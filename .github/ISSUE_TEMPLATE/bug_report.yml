name: Bug report
description: Report a reproducible schema, validator, documentation, or registry defect.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve YGit Schema. Do not include secrets or private manifests.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - VPMS schema
        - Python validator
        - Examples or fixtures
        - Registry website
        - Documentation
        - CI/CD or release tooling
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, Node.js version, and browser where relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private data from the report.
          required: true
