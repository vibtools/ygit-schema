# ============================================================================
# YGit Schema
# Official Dependency Compatibility Matrix
# ============================================================================
#
# Status : Frozen Structure
# Version: 1.0
#
# This file is the single source of truth for all officially supported
# dependency versions used by the project.
#
# Any dependency update MUST update this file first.
#
# ============================================================================

project:
  name: ygit-schema
  version: 1.0.0
  compatibility_version: 1.0

platform:

  operating_system:
    windows:
      supported: true

    linux:
      supported: true

    macos:
      supported: true

runtime:

  node:
    version: ">=22.0.0"

  npm:
    version: ">=10.0.0"

  python:
    version: ">=3.12"

framework:

  astro:
    version: "5.x"

language:

  typescript:
    version: "5.x"

css:

  tailwindcss:
    version: "4.x"

linting:

  eslint:
    version: "9.x"

formatting:

  prettier:
    version: "3.x"

search:

  pagefind:
    version: "1.x"

icons:

  lucide_astro:
    version: "latest-compatible"

validation:

  json_schema:
    draft: "2020-12"

testing:

  pytest:
    version: "8.x"

documentation:

  astro_content:
    version: "compatible"

ci:

  github_actions:
    version: "latest-compatible"

build:

  vite:
    version: "compatible"

package_manager:

  lockfile:
    required: true

verification:

  type_check:
    required: true

  lint:
    required: true

  validation:
    required: true

  production_build:
    required: true

  github_actions:
    required: true

  forensic_audit:
    required: true

rules:

  allow_unverified_upgrade: false

  allow_unverified_downgrade: false

  allow_dependency_conflicts: false

  allow_build_failure: false

  allow_ci_failure: false

  allow_missing_imports: false

  allow_missing_exports: false

  allow_type_errors: false

  allow_lint_errors: false

  allow_documentation_desynchronization: false

  allow_release_without_verification: false

policy:

  update_process:

    - Review Release Notes

    - Review Breaking Changes

    - Review Migration Guide

    - Update compatibility.yaml

    - Install Dependencies

    - Type Check

    - Lint

    - Validation

    - Production Build

    - GitHub Actions

    - Forensic Audit

    - Documentation Update

    - Release

status:

  frozen_structure: true

  editable_versions: true

  single_source_of_truth: true